services:
  postgres:
    image: postgres:18-alpine
    container_name: crash-game-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      # Só no loopback do host; o jail acessa pela rede crash-game.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql, não em .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - crash-game
    restart: unless-stopped

networks:
  crash-game:
    external: true

volumes:
  postgres-data:
