services:
  claude:
    build:
      context: .
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-100}
    container_name: crash-game-claude
    working_dir: /workspace
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      TZ: America/Recife
    volumes:
      - ..:/workspace
      - claude-config:/home/node/.claude
    ports:
      - "3000:3000"   # API
      - "5173:5173"   # Vite
    networks:
      - default
      - crash-game    # alcança o Postgres do docker-compose.yml da raiz como postgres:5432
    stdin_open: true
    tty: true

networks:
  crash-game:
    external: true

volumes:
  claude-config:
