name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sem "version": usa o campo packageManager do package.json da raiz.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # api e web importam o @crash/shared pelo dist.
      - name: Build do shared
        run: pnpm --filter @crash/shared build

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  integration:
    runs-on: ubuntu-latest
    # Postgres de teste (D39): mesma imagem do docker-compose.yml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crash
          POSTGRES_PASSWORD: crash
          POSTGRES_DB: crash_game
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crash -d crash_game"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Credenciais só deste container efêmero, sem valor fora do CI.
      DATABASE_URL: postgres://crash:crash@localhost:5432/crash_game
      TEST_DATABASE_URL: postgres://crash:crash@localhost:5432/crash_game_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build do shared
        run: pnpm --filter @crash/shared build

      - name: Testes de integração
        run: pnpm --filter @crash/api test:int

      - name: Testes E2E
        run: pnpm --filter @crash/api test:e2e

      - name: Migrations em dia com os registros
        run: pnpm --filter @crash/api migration:check
